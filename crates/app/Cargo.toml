[package]
name = "hamish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "app"

[[bin]]
name = "hamish"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
gpui.workspace = true
gpui_platform.workspace = true
hamish-core = { path = "../core", version = "0.2.0" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3.23.0"

[[bench]]
name = "editor"
harness = false

[package.metadata.dist]
dist = true

[lints]
workspace = true
