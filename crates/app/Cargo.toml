[package]
name = "ka-teb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "app"

[[bin]]
name = "ka-teb"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
gpui.workspace = true
ka-teb-core = { path = "../core", version = "0.1.0" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3.23.0"

[[bench]]
name = "editor"
harness = false

[package.metadata.dist]
dist = true

[lints]
workspace = true
