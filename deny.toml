[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "mockall", reason = "test at real seams with fakes or stubs, not mocks" },
    { crate = "mockito", reason = "test at real seams with fakes or stubs, not mocks" },
    { crate = "faux", reason = "test at real seams with fakes or stubs, not mocks" },
    { crate = "mry", reason = "test at real seams with fakes or stubs, not mocks" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
