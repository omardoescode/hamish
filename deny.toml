[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "mockall", reason = "test at real seams with fakes or stubs, not mocks" },
    { crate = "mockito", reason = "test at real seams with fakes or stubs, not mocks" },
    { crate = "faux", reason = "test at real seams with fakes or stubs, not mocks" },
    { crate = "mry", reason = "test at real seams with fakes or stubs, not mocks" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI comes from Zed git (ADR 0009). Each entry is a git source in the Linux graph.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/RustAudio/cpal",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/smol-rs/async-task",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/khronos-egl",
]
