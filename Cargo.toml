[workspace]
members = ["crates/core", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/omardoescode/ka-teb"

[workspace.dependencies]
gpui = "=0.2.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
