[workspace]
members = ["crates/core", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/omardoescode/hamish"

[workspace.dependencies]
gpui = "=0.2.2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"

[workspace.lints.cargo]
unused_dependencies = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
