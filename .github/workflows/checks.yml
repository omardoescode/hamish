name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build libraries (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev
          version: 1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build libraries (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev
          version: 1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true
      - name: unit tests
        run: cargo test --workspace --lib --bins
      - name: integration tests
        run: cargo test --workspace --test '*'
      - name: doc tests
        run: cargo test --workspace --doc

  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1,cargo-shear@1.14.1
      # pedant ships no prebuilt binary (not on its GitHub releases, not in cargo-quickinstall),
      # so it compiles once; rust-cache keeps it in ~/.cargo/bin after that.
      - name: Install pedant
        run: pedant --version 2>/dev/null | grep -qx 'pedant 0.31.1' || cargo install pedant --version 0.31.1 --locked
      - run: cargo deny check
      - run: cargo shear
      - run: pedant check --format github crates
